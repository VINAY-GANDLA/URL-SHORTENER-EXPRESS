<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your shortened link is ready to share.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <title>Linklet | Your Short Link</title>
</head>

<body>
    <main class="page result-page">
        <nav class="nav" aria-label="Main navigation">
            <a class="logo" href="/" aria-label="Linklet home">
                <span class="logo-mark">↗</span>
                <span>linklet</span>
            </a>
            <span class="status"><span class="status-dot"></span>Link created</span>
        </nav>

        <section class="result-hero">
            <p class="eyebrow"><span></span> Your link is ready</p>
            <h1>Small link.<br><em>Big reach.</em></h1>
            <p class="intro">Your new link is ready to share wherever your audience is.</p>

            <div class="result-box">
                <div class="result-icon" aria-hidden="true">✓</div>
                <div class="result-content">
                    <p class="box-label">Generated link</p>
                    <div class="urls"></div>
                </div>

            </div>

            <a class="back-link" href="/">← Shorten another link</a>
        </section>

        <footer class="footer">
            <span>LINKLET / URL SHORTENER</span>
            <span>Make less link. Do more.</span>
        </footer>
    </main>

    <script>
        // const copyButton = document.querySelector('.copy-button');

        // copyButton.addEventListener('click', async () => {
        //     await navigator.clipboard.writeText(copyButton.dataset.copy);
        //     copyButton.innerHTML = 'Copied <span aria-hidden="true">✓</span>';
        // });
        const links = document.querySelector(".urls");
        const GetUrls = async () => {
            try {
                const response = await fetch("/details");
                const result = await response.json();
                if (result.success) {
                    Object.entries(result.data).forEach(([shortUrl, url]) => {
                        const data = `<div class="links">
                        <ul>
                            <li style="list-style: none;"><a class="short-link" href="${shortUrl}"
                                    style="text-decoration: none;">${shortUrl}</a>
                            </li>
                            <p class="original-link"><span>From</span> ${url}</p>
                        </ul>
                        <button class="copy-button" type="button" data-copy="${shortUrl}">Copy <span
                        aria-hidden="true">↗</span></button>
                    </div>`
                        const nayadiv = document.createElement('div');
                        nayadiv.innerHTML = data;
                        links.append(nayadiv);
                    });
                }
                else {
                    console.log(result.message);
                }
                // console.log(result);
            }
            catch (err) {
                console.log(err.message);
            }
        }
        GetUrls();
        links.addEventListener("click", async (event) => {

            if (event.target.closest(".copy-button")) {

                const copyButton = event.target.closest(".copy-button");

                await navigator.clipboard.writeText(
                    `${window.location.origin}/${copyButton.dataset.copy}`
                );

                copyButton.innerHTML =
                    'Copied <span aria-hidden="true">✓</span>';
            }

        });

    </script>
</body>

</html>
